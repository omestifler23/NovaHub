services:
  - type: web
    name: novahub
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_URL
        sync: false
      - key: DB_PATH
        value: /var/data/novahub.db
    disk:
      name: novahub-data
      mountPath: /var/data
      sizeGB: 1
